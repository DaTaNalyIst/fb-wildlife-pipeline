name: 3 — Facebook Poster

on:
  schedule:
    # 10:00 PM EAT = 7:00 PM EST = 19:00 UTC
    - cron: '0 19 * * *'
    # 11:00 PM EAT = 8:00 PM EST = 20:00 UTC
    - cron: '0 20 * * *'
    # 12:00 AM EAT = 9:00 PM EST = 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Force slot (0, 1, or 2). Leave empty for auto.'
        default: ''

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Get latest video release tag
        id: get-release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.data.length > 0) {
              core.setOutput('release_tag', releases.data[0].tag_name);
              core.setOutput('found', 'true');
            } else {
              core.setOutput('found', 'false');
            }

      - name: Post to Facebook
        if: steps.get-release.outputs.found == 'true'
        env:
          FB_PAGE_TOKEN_1: ${{ secrets.FB_PAGE_TOKEN_1 }}
          FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
          FB_PAGE_TOKEN_3: ${{ secrets.FB_PAGE_TOKEN_3 }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          FB_GROUP_IDS: ${{ secrets.FB_GROUP_IDS }}
          RELEASE_TAG: ${{ steps.get-release.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          FORCE_SLOT: ${{ inputs.slot }}
        run: python scripts/post_to_facebook.py

      - name: Commit post log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "log: fb post $(date +%Y-%m-%dT%H:%M)"
          git push || true
